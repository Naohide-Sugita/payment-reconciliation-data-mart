version: 2

sources:
  - name: raw
    description: >-
      dbt seedで投入する固定サンプルデータ。
      照合テストケースの入力構造を保持し、文字列整形と型変換はstagingモデルで行う。
    database: payment-recon-mart
    schema: raw

    tables:
      - name: merchants
        description: "加盟店マスタの入力データ。粒度は加盟店IDごとに1行。"
        columns:
          - name: merchant_id
            description: "加盟店を識別するID。"
          - name: merchant_name
            description: "加盟店の表示名。"
          - name: fee_rate
            description: "契約上の手数料率。小数で入力する。"

      - name: orders
        description: "注文の入力データ。粒度は注文IDごとに1行。"
        columns:
          - name: order_id
            description: "注文を識別するID。"
          - name: merchant_id
            description: "注文に記録された加盟店ID。"
          - name: order_amount
            description: "注文金額。通貨の最小単位未満を含まない整数値。"
          - name: ordered_at
            description: "注文が行われた日時。"

      - name: payments
        description: "決済の入力データ。粒度は決済IDごとに1行。"
        columns:
          - name: payment_id
            description: "決済を識別するID。"
          - name: order_id
            description: "決済に対応する注文ID。"
          - name: payment_amount
            description: "決済金額。通貨の最小単位未満を含まない整数値。"
          - name: payment_status
            description: "決済処理から受け取った決済結果。"
          - name: settlement_batch_id
            description: "成功決済と精算データを紐づける精算バッチID。"
          - name: paid_at
            description: "決済が処理された日時。"

      - name: settlements
        description: "精算の入力データ。粒度は精算IDかつ精算バッチIDごとに1行。"
        columns:
          - name: settlement_id
            description: "精算を識別するID。"
          - name: settlement_batch_id
            description: "決済と精算を紐づける精算バッチID。"
          - name: merchant_id
            description: "精算に記録された加盟店ID。"
          - name: gross_amount
            description: "手数料控除前の精算総額。"
          - name: fee_amount
            description: "精算総額から控除された手数料額。"
          - name: net_amount
            description: "手数料控除後の入金額。"
          - name: settlement_status
            description: "精算処理の状態。"
          - name: settled_at
            description: "精算が処理された日時。"
