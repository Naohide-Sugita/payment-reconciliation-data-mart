version: 2

models:
  - name: stg_merchants
    description: >-
      加盟店マスタのIDと名称から前後の空白を除去し、手数料率をNUMERIC型へ変換する。
      粒度は加盟店IDごとに1行。
    columns:
      - name: merchant_id
        data_type: string
        description: "主キー。前後の空白を除去した加盟店ID。NULL不可かつ一意。"
        data_tests:
          - not_null
          - unique
      - name: merchant_name
        data_type: string
        description: "前後の空白を除去した加盟店の表示名。"
      - name: fee_rate
        data_type: numeric
        description: "SAFE_CASTでNUMERIC型へ変換した契約手数料率。NULLの場合は照合モデルで手数料率欠損として検知する。"

  - name: stg_orders
    description: >-
      注文データを整形し、金額と日時をBigQueryのデータ型へ変換する。
      粒度は注文IDごとに1行。
    columns:
      - name: order_id
        data_type: string
        description: "主キー。前後の空白を除去した注文ID。NULL不可かつ一意。"
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        data_type: string
        description: "前後の空白を除去した加盟店ID。NULL不可。加盟店マスタに存在しない場合は照合モデルで加盟店マスタ欠損として検知する。"
        data_tests:
          - not_null
      - name: order_amount
        data_type: int64
        description: "SAFE_CASTでINT64型へ変換した注文金額。NULL不可。"
        data_tests:
          - not_null
      - name: ordered_at
        data_type: timestamp
        description: "SAFE_CASTでTIMESTAMP型へ変換した注文日時。"

  - name: stg_payments
    description: >-
      決済データを整形し、決済状態を大文字へ統一して、金額と日時をBigQueryのデータ型へ変換する。
      粒度は決済IDごとに1行。
    columns:
      - name: payment_id
        data_type: string
        description: "主キー。前後の空白を除去した決済ID。NULL不可かつ一意。"
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_type: string
        description: "前後の空白を除去した注文ID。stg_ordersの注文IDを参照し、NULL不可。"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_amount
        data_type: int64
        description: "SAFE_CASTでINT64型へ変換した決済金額。"
      - name: payment_status
        data_type: string
        description: "大文字へ統一した決済状態。許容値はSUCCESSまたはFAILED。"
        data_tests:
          - accepted_values:
              arguments:
                values: ['SUCCESS', 'FAILED']
      - name: settlement_batch_id
        data_type: string
        description: "前後の空白を除去した精算バッチID。空文字はNULLへ変換する。"
      - name: paid_at
        data_type: timestamp
        description: "SAFE_CASTでTIMESTAMP型へ変換した決済日時。"

  - name: stg_settlements
    description: >-
      精算データを整形し、精算状態を大文字へ統一して、金額と日時をBigQueryのデータ型へ変換する。
      粒度は精算IDかつ精算バッチIDごとに1行。
    columns:
      - name: settlement_id
        data_type: string
        description: "精算ID。NULL不可かつ一意。"
        data_tests:
          - not_null
          - unique
      - name: settlement_batch_id
        data_type: string
        description: "成功決済との結合に使用する精算バッチID。NULL不可かつ一意。"
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        data_type: string
        description: "前後の空白を除去した、精算に記録された加盟店ID。"
      - name: gross_amount
        data_type: int64
        description: "SAFE_CASTでINT64型へ変換した精算総額。"
      - name: fee_amount
        data_type: int64
        description: "SAFE_CASTでINT64型へ変換した実手数料額。"
      - name: net_amount
        data_type: int64
        description: "SAFE_CASTでINT64型へ変換した実入金額。"
      - name: settlement_status
        data_type: string
        description: "大文字へ統一した精算処理の状態。"
      - name: settled_at
        data_type: timestamp
        description: "SAFE_CASTでTIMESTAMP型へ変換した精算日時。"
