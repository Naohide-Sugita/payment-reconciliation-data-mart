version: 2

models:
  - name: stg_merchants
    columns:
      - name: merchant_id
        data_tests:
          - not_null
          - unique

      - name: fee_rate
        data_tests:
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: merchant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id

      - name: order_amount
        data_tests:
          - not_null

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['SUCCESS', 'FAILED']

  - name: stg_settlements
    columns:
      - name: settlement_id
        data_tests:
          - not_null
          - unique

      - name: settlement_batch_id
        data_tests:
          - not_null
          - unique