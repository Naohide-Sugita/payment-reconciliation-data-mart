version: 2

models:
  - name: fct_payment_reconciliation
    description: >-
      注文ごとに成功決済、加盟店マスタ、精算データを照合する。
      期待手数料と期待入金額を算出し、12種類の異常フラグを評価して、
      総合状態をMATCHEDまたはERRORとして出力する。粒度は注文IDごとに1行。
    columns:
      - name: order_id
        data_type: string
        description: "主キー。stg_ordersから取得した注文ID。"
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        data_type: string
        description: "注文に記録された加盟店ID。"
      - name: merchant_name
        data_type: string
        description: "加盟店マスタの表示名。該当するマスタがない場合はNULL。"
      - name: order_amount
        data_type: int64
        description: "注文金額。通貨の最小単位未満を含まない整数値。"
      - name: ordered_at
        data_type: timestamp
        description: "注文が行われた日時。"
      - name: payment_id
        data_type: string
        description: "成功決済のID。成功決済がない場合はNULL。"
      - name: payment_amount
        data_type: int64
        description: "成功決済の金額。成功決済がない場合はNULL。"
      - name: settlement_batch_id
        data_type: string
        description: "成功決済に記録された精算バッチID。"
      - name: paid_at
        data_type: timestamp
        description: "成功決済が処理された日時。"
      - name: settlement_id
        data_type: string
        description: "精算ID。紐づく精算がない場合はNULL。"
      - name: settlement_merchant_id
        data_type: string
        description: "精算に記録された加盟店ID。"
      - name: gross_amount
        data_type: int64
        description: "精算に記録された手数料控除前の総額。"
      - name: actual_fee_amount
        data_type: int64
        description: "精算に記録された実手数料額。"
      - name: actual_net_amount
        data_type: int64
        description: "精算に記録された実入金額。"
      - name: settlement_status
        data_type: string
        description: "精算処理の状態。"
      - name: settled_at
        data_type: timestamp
        description: "精算が処理された日時。"
      - name: fee_rate
        data_type: numeric
        description: "加盟店マスタから取得した契約手数料率。"
      - name: expected_fee_amount
        data_type: int64
        description: "期待手数料額。payment_amount × fee_rateを四捨五入し、INT64型へ変換する。"
      - name: expected_net_amount
        data_type: int64
        description: "期待入金額。payment_amountからexpected_fee_amountを差し引いて算出する。"
      - name: is_payment_missing
        data_type: boolean
        description: "注文に紐づく成功決済がない場合にTRUE。"
        data_tests: [not_null]
      - name: is_merchant_missing
        data_type: boolean
        description: "注文の加盟店IDが加盟店マスタに存在しない場合にTRUE。"
        data_tests: [not_null]
      - name: is_fee_rate_missing
        data_type: boolean
        description: "加盟店マスタは存在するが、手数料率がNULLの場合にTRUE。"
        data_tests: [not_null]
      - name: is_order_payment_amount_mismatch
        data_type: boolean
        description: "注文金額と決済金額が一致しない場合にTRUE。"
        data_tests: [not_null]
      - name: is_settlement_missing
        data_type: boolean
        description: "成功決済はあるが、紐づく精算がない場合にTRUE。"
        data_tests: [not_null]
      - name: is_settlement_not_completed
        data_type: boolean
        description: "紐づく精算の状態がCOMPLETEDでない場合にTRUE。"
        data_tests: [not_null]
      - name: is_merchant_mismatch
        data_type: boolean
        description: "注文の加盟店IDと精算の加盟店IDが一致しない場合にTRUE。"
        data_tests: [not_null]
      - name: is_gross_amount_mismatch
        data_type: boolean
        description: "精算総額と決済金額が一致しない場合にTRUE。"
        data_tests: [not_null]
      - name: is_fee_amount_mismatch
        data_type: boolean
        description: "実手数料額と期待手数料額が一致しない場合にTRUE。"
        data_tests: [not_null]
      - name: is_net_amount_mismatch
        data_type: boolean
        description: "実入金額と期待入金額が一致しない場合にTRUE。"
        data_tests: [not_null]
      - name: is_payment_datetime_invalid
        data_type: boolean
        description: "判定に必要な注文・決済日時がNULL、または決済日時が注文日時より前の場合にTRUE。"
        data_tests: [not_null]
      - name: is_settlement_datetime_invalid
        data_type: boolean
        description: "判定に必要な決済・精算日時がNULL、または精算日時が決済日時より前の場合にTRUE。"
        data_tests: [not_null]
      - name: error_count
        data_type: int64
        description: "12種類の照合異常フラグのうち、TRUEとなった件数。"
        data_tests: [not_null]
      - name: reconciliation_status
        data_type: string
        description: "error_countが1以上ならERROR、それ以外はMATCHED。"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MATCHED
                  - ERROR


  - name: fct_reconciliation_errors
    description: >-
      照合で検出された異常を、注文IDとエラー要因の組み合わせごとに1行で出力する。
      fct_payment_reconciliationの12種類の異常フラグを行へ変換し、
      エラー種別別の集計およびエラー対象データの確認に使用する。
    columns:
      - name: order_id
        data_type: string
        description: "異常が検出された注文ID。"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_payment_reconciliation')
                field: order_id

      - name: merchant_id
        data_type: string
        description: "注文に記録された加盟店ID。"

      - name: merchant_name
        data_type: string
        description: "加盟店マスタから取得した加盟店名。"

      - name: payment_id
        data_type: string
        description: "注文に紐づく成功決済のID。決済データ欠損の場合はNULL。"

      - name: settlement_id
        data_type: string
        description: "成功決済に紐づく精算ID。精算データ欠損の場合はNULL。"

      - name: error_code
        data_type: string
        description: "異常フラグの列名を使用した機械判読用のエラーコード。"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - is_payment_missing
                  - is_merchant_missing
                  - is_fee_rate_missing
                  - is_order_payment_amount_mismatch
                  - is_settlement_missing
                  - is_settlement_not_completed
                  - is_merchant_mismatch
                  - is_gross_amount_mismatch
                  - is_fee_amount_mismatch
                  - is_net_amount_mismatch
                  - is_payment_datetime_invalid
                  - is_settlement_datetime_invalid

      - name: error_reason
        data_type: string
        description: "業務担当者向けの日本語によるエラー要因。"
        data_tests:
          - not_null

      - name: order_amount
        data_type: int64
        description: "注文金額。"

      - name: payment_amount
        data_type: int64
        description: "成功決済の金額。決済データ欠損の場合はNULL。"

      - name: gross_amount
        data_type: int64
        description: "精算に記録された手数料控除前の総額。"

      - name: actual_fee_amount
        data_type: int64
        description: "精算に記録された実手数料額。"

      - name: expected_fee_amount
        data_type: int64
        description: "決済金額と契約手数料率から算出した期待手数料額。"

      - name: actual_net_amount
        data_type: int64
        description: "精算に記録された実入金額。"

      - name: expected_net_amount
        data_type: int64
        description: "決済金額から期待手数料額を差し引いた期待入金額。"

      - name: ordered_at
        data_type: timestamp
        description: "注文が行われた日時。"

      - name: paid_at
        data_type: timestamp
        description: "成功決済が処理された日時。"

      - name: settled_at
        data_type: timestamp
        description: "精算が処理された日時。"
