version: 2

models:
  - name: stg_merchants
    description: >-
      Cleans the merchant master input by trimming identifiers and names and
      converting the fee rate to NUMERIC. Grain: one row per merchant_id.
    columns:
      - name: merchant_id
        data_type: string
        description: "Primary key. Trimmed merchant identifier; required and unique."
        data_tests:
          - not_null
          - unique
      - name: merchant_name
        data_type: string
        description: "Trimmed merchant display name."
      - name: fee_rate
        data_type: numeric
        description: "Contracted fee rate converted with SAFE_CAST; required for fee calculation."
        data_tests:
          - not_null

  - name: stg_orders
    description: >-
      Cleans order input and converts amount and timestamp fields to BigQuery
      types. Grain: one row per order_id.
    columns:
      - name: order_id
        data_type: string
        description: "Primary key. Trimmed order identifier; required and unique."
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        data_type: string
        description: "Trimmed merchant identifier; must reference stg_merchants."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id
      - name: order_amount
        data_type: int64
        description: "Order amount in whole currency units, converted with SAFE_CAST."
        data_tests:
          - not_null
      - name: ordered_at
        data_type: timestamp
        description: "Order timestamp converted with SAFE_CAST."

  - name: stg_payments
    description: >-
      Cleans payment input, normalizes status values, and converts amount and
      timestamp fields. Grain: one row per payment_id.
    columns:
      - name: payment_id
        data_type: string
        description: "Primary key. Trimmed payment identifier; required and unique."
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_type: string
        description: "Trimmed order identifier; must reference stg_orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_amount
        data_type: int64
        description: "Payment amount in whole currency units, converted with SAFE_CAST."
      - name: payment_status
        data_type: string
        description: "Uppercase payment status; limited to SUCCESS or FAILED."
        data_tests:
          - accepted_values:
              arguments:
                values: ['SUCCESS', 'FAILED']
      - name: settlement_batch_id
        data_type: string
        description: "Trimmed settlement batch identifier; blank strings are converted to NULL."
      - name: paid_at
        data_type: timestamp
        description: "Payment timestamp converted with SAFE_CAST."

  - name: stg_settlements
    description: >-
      Cleans settlement input, normalizes status values, and converts amount
      and timestamp fields. Grain: one row per settlement_id and settlement_batch_id.
    columns:
      - name: settlement_id
        data_type: string
        description: "Settlement identifier; required and unique."
        data_tests:
          - not_null
          - unique
      - name: settlement_batch_id
        data_type: string
        description: "Settlement batch identifier used to join successful payments; required and unique."
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        data_type: string
        description: "Trimmed merchant identifier recorded on the settlement."
      - name: gross_amount
        data_type: int64
        description: "Gross settlement amount converted with SAFE_CAST."
      - name: fee_amount
        data_type: int64
        description: "Actual fee amount converted with SAFE_CAST."
      - name: net_amount
        data_type: int64
        description: "Actual net amount converted with SAFE_CAST."
      - name: settlement_status
        data_type: string
        description: "Uppercase settlement processing status."
      - name: settled_at
        data_type: timestamp
        description: "Settlement timestamp converted with SAFE_CAST."
